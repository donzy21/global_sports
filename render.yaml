version: "1"
services:
- type: web
  name: Global_sports_backend
  runtime: node
  repo: https://github.com/donzy21/global_sports
  plan: free
  envVars:
  - key: PAYSTACK_SECRET
    sync: false
  - key: MONGO_URI
    sync: false
  - key: JWT_SECRET
    sync: false
  - key: RIDER_JWT_SECRET
    sync: false
  - key: CORS_ORIGINS
    sync: false
